services:
  auth-service-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENV=dev
    restart: unless-stopped
    volumes:
      - .:/app
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --no-control-socket
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
    networks:
      - red_publica
      - red_datos

networks:
  red_publica:
    external: true
  red_datos:
    external: true