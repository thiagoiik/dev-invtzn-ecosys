<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" preserveAspectRatio="none">
  <!-- Elegantes esquinas florales estilizadas vectoriales -->
  <g stroke="#6e8f6e" fill="none" stroke-width="2" stroke-linecap="round">
    <!-- Esquina superior izquierda -->
    <path d="M 30 150 C 30 80, 80 30, 150 30" />
    <path d="M 30 110 C 50 90, 90 50, 110 30" />
    <path d="M 30 80 A 15 15 0 0 1 50 65" />
    <!-- Hojitas -->
    <path d="M 50 65 Q 65 50, 60 40 Q 45 45, 50 65" fill="#a3c4a3"/>
    <path d="M 80 35 Q 95 20, 90 10 Q 75 15, 80 35" fill="#a3c4a3"/>
    <path d="M 35 80 Q 20 95, 10 90 Q 15 75, 35 80" fill="#a3c4a3"/>

    <!-- Esquina superior derecha -->
    <path d="M 770 150 C 770 80, 720 30, 650 30" />
    <path d="M 770 110 C 750 90, 710 50, 690 30" />
    <path d="M 750 65 Q 735 50, 740 40 Q 755 45, 750 65" fill="#a3c4a3"/>
    <path d="M 720 35 Q 705 20, 710 10 Q 725 15, 720 35" fill="#a3c4a3"/>

    <!-- Esquina inferior izquierda -->
    <path d="M 30 1050 C 30 1120, 80 1170, 150 1170" />
    <path d="M 30 1090 C 50 1110, 90 1150, 110 1170" />
    <path d="M 50 1135 Q 65 1150, 60 1160 Q 45 1155, 50 1135" fill="#a3c4a3"/>
    <path d="M 80 1165 Q 95 1180, 90 1190 Q 75 1185, 80 1165" fill="#a3c4a3"/>

    <!-- Esquina inferior derecha -->
    <path d="M 770 1050 C 770 1120, 720 1170, 650 1170" />
    <path d="M 770 1090 C 750 1110, 710 1150, 690 1170" />
    <path d="M 750 1135 Q 735 1150, 740 1160 Q 755 1155, 750 1135" fill="#a3c4a3"/>
    <path d="M 720 1165 Q 705 1180, 710 1190 Q 725 1185, 720 1165" fill="#a3c4a3"/>
  </g>
</svg>
