<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#faf9f6"/>
  <filter id="paper-texture">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="2" result="light">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
    <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
  </filter>
  <rect width="100%" height="100%" fill="#faf9f6" filter="url(#paper-texture)" opacity="0.25"/>
</svg>
