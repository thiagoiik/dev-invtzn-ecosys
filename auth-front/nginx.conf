server {
    listen 8080;
    server_name localhost;

    # Directorio donde vive tu build de Vue
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Esta es la magia: si no encuentra el archivo, entrega index.html
        # para que Vue Router tome el control de la navegación
        try_files $uri $uri/ /index.html;
    }

    # Optimización: cachea archivos estáticos (js, css, imágenes) por 1 año
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}