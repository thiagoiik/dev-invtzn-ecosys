# =========================================================================
# CONFIGURACIÓN DE PROXY REVERSO NGINX Y CERTBOT PARA PRODUCCIÓN / SANDBOX
# =========================================================================
# NOTA: Reemplaza "tudominio.com" con tu dominio real configurado en DNS.

# -------------------------------------------------------------------------
# 1. FRONTEND: app.tudominio.com
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.tudominio.com; # <-- REEMPLAZAR CON TU DOMINIO REAL

    # Certificados Let's Encrypt (Autogenerados y renovados por el contenedor)
    ssl_certificate /etc/letsencrypt/live/app.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.tudominio.com/privkey.pem;

    # Protocolos y Cifrados Recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Configuración de Logs
    access_log /var/log/nginx/front_access.log;
    error_log /var/log/nginx/front_error.log warn;

    location / {
        proxy_pass http://auth-front:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (si fuera necesario para HMR/servicios en vivo)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# -------------------------------------------------------------------------
# 2. BACKEND AUTH API: api.auth.tudominio.com
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.auth.tudominio.com; # <-- REEMPLAZAR CON TU DOMINIO REAL

    ssl_certificate /etc/letsencrypt/live/api.auth.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.auth.tudominio.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/auth_api_access.log;
    error_log /var/log/nginx/auth_api_error.log warn;

    location / {
        proxy_pass http://auth-service-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

