# =========================================================================
# CONFIGURACIÓN DE PROXY REVERSO NGINX Y CERTBOT DINÁMICO POR ENTORNO
# =========================================================================
# Las variables ${DOMAIN_FRONT}, ${DOMAIN_AUTH_API} y ${DOMAIN_INVTZN_API}
# se inyectan dinámicamente desde el archivo .env del servidor al arrancar.

# -------------------------------------------------------------------------
# 1. FRONTEND: ${DOMAIN_FRONT}
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMAIN_FRONT};

    # Certificados Let's Encrypt (Inyectados y renovados dinámicamente)
    ssl_certificate /etc/letsencrypt/live/${DOMAIN_FRONT}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_FRONT}/privkey.pem;

    # Protocolos y Cifrados Recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Configuración de Logs
    access_log /var/log/nginx/front_access.log;
    error_log /var/log/nginx/front_error.log warn;

    location / {
        proxy_pass http://auth-front:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# -------------------------------------------------------------------------
# 2. BACKEND AUTH API: ${DOMAIN_AUTH_API}
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMAIN_AUTH_API};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_AUTH_API}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_AUTH_API}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/auth_api_access.log;
    error_log /var/log/nginx/auth_api_error.log warn;

    location / {
        proxy_pass http://auth-service-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------------------
# 3. BACKEND NEGOCIO API: ${DOMAIN_INVTZN_API}
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMAIN_INVTZN_API};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_INVTZN_API}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_INVTZN_API}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/invtzn_api_access.log;
    error_log /var/log/nginx/invtzn_api_error.log warn;

    location / {
        proxy_pass http://invtzn-service-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
