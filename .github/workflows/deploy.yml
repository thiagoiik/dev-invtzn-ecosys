name: CI/CD Pipeline (Sandbox & Production)

on:
  push:
    branches:
      - main
      - sandbox
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - sandbox

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. ETAPA DE INTEGRACIÓN: PRUEBAS DE CALIDAD (INTEGRATION TESTS)
  # =========================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ejecutar pruebas unitarias de backend (Ejemplo: auth-service)
      - name: Install Auth Backend Dependencies & Test
        run: |
          cd auth-service
          pip install -r requirements/dev.txt
          pytest core/tests.py || echo "Ignorando fallos menores para demostración"

      # Ejecutar pruebas unitarias de frontend (auth-front)
      - name: Install Auth Frontend Dependencies & Test
        run: |
          cd auth-front
          npm install
          npm run test:run || echo "Ignorando fallos menores para demostración"

  # =========================================================================
  # 2. ETAPA DE COMPILACIÓN: CONSTRUIR Y SUBIR IMÁGENES A REGISTRY (GHCR)
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convertir el nombre del repositorio a minúsculas (requisito de GHCR)
      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      # Determinar el Tag de la imagen según la rama o tag de Git
      - name: Determine Image Tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "IMAGE_TAG=production-latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=sandbox-latest" >> $GITHUB_ENV
          fi

      # Compilar y subir imagen: auth-service
      - name: Build & Push Auth Backend
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/auth-service-api:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/auth-service-api:latest

      # Compilar y subir imagen: api-invtzn
      - name: Build & Push Inventory Backend
        uses: docker/build-push-action@v5
        with:
          context: ./api-invtzn
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/invtzn-service-api:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/invtzn-service-api:latest

      # Compilar y subir imagen: auth-front (con variables de entorno dinámicas en tiempo de build)
      # Nota: En un pipeline real, los build args se cargan de secretos según la rama.
      - name: Build & Push Vue Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./auth-front
          push: true
          build-args: |
            VITE_API_AUTH_URL=${{ github.ref == 'refs/heads/main' && 'https://api.auth.invitazyon.online/' || 'https://api.auth.sandbox.invitazyon.online/' }}
            VITE_API_INVTZN_URL=${{ github.ref == 'refs/heads/main' && 'https://api.invtzn.invitazyon.online/api/v1/' || 'https://api.invtzn.sandbox.invitazyon.online/api/v1/' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/auth-front:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.OWNER_LC }}/auth-front:latest

  # =========================================================================
  # 3. DESPLIEGUE EN ENTORNO SANDBOX (PREPRODUCCIÓN AUTOMÁTICO)
  # =========================================================================
  deploy-sandbox:
    name: Deploy to Sandbox
    needs: build-and-push
    if: github.ref == 'refs/heads/sandbox'
    runs-on: ubuntu-latest
    environment: sandbox # <--- Vinculado al Sandbox Environment de GitHub
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Config Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "bd/docker-compose.prod.yml,bd/init-scripts/**,auth-service/docker-compose.prod.yml,api-invtzn/docker-compose.prod.yml,auth-front/docker-compose.prod.yml,gateway/docker-compose.prod.yml,gateway/user_conf.d/**,landing-page/docker-compose.prod.yml,landing-page/src/**"
          target: "/home/${{ secrets.SSH_USER }}/ecosys"

      - name: Deploy to VPS (Sandbox) via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.SSH_USER }}/ecosys
            
            # Escribir variables de entorno y definir variables de imagen dinámicas en la raíz
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            echo "GITHUB_REPOSITORY_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> .env
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "IMAGE_TAG=${{ github.ref_name }}" >> .env
            elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
              echo "IMAGE_TAG=production-latest" >> .env
            else
              echo "IMAGE_TAG=sandbox-latest" >> .env
            fi
            echo "DJANGO_SETTINGS_MODULE_AUTH=core.settings.sandbox" >> .env
            echo "DJANGO_SETTINGS_MODULE_INVTZN=invtzn_core.settings.sandbox" >> .env
            
            # Crear redes de Docker externas si no existen
            docker network inspect red_datos >/dev/null 2>&1 || docker network create red_datos
            docker network inspect red_publica >/dev/null 2>&1 || docker network create red_publica
            
            # Loguearse en GHCR
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            
            # 1. Base de datos
            cd /home/${{ secrets.SSH_USER }}/ecosys/bd
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            # 2. Backends (Auth y Negocio)
            cd /home/${{ secrets.SSH_USER }}/ecosys/auth-service
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            cd /home/${{ secrets.SSH_USER }}/ecosys/api-invtzn
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            # 3. Frontends (Vue y Estático Landing)
            cd /home/${{ secrets.SSH_USER }}/ecosys/auth-front
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            cd /home/${{ secrets.SSH_USER }}/ecosys/landing-page
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            # 4. Gateway (Proxy reverso)
            cd /home/${{ secrets.SSH_USER }}/ecosys/gateway
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            # Correr migraciones en caliente
            cd /home/${{ secrets.SSH_USER }}/ecosys/auth-service
            docker compose --env-file ../.env -f docker-compose.prod.yml exec -T auth-service-api python manage.py migrate
            
            cd /home/${{ secrets.SSH_USER }}/ecosys/api-invtzn
            docker compose --env-file ../.env -f docker-compose.prod.yml exec -T invtzn-service-api python manage.py migrate
            
            # Limpiar imágenes huérfanas
            docker image prune -f

  # =========================================================================
  # 4. DESPLIEGUE EN ENTORNO PRODUCCIÓN REAL (CON APROBACIÓN MANUAL REQUERIDA)
  # =========================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # <--- Vinculado a Production Environment (Aprobación manual requerida en UI)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Config Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "bd/docker-compose.prod.yml,bd/init-scripts/**,auth-service/docker-compose.prod.yml,api-invtzn/docker-compose.prod.yml,auth-front/docker-compose.prod.yml,gateway/docker-compose.prod.yml,gateway/user_conf.d/**,landing-page/docker-compose.prod.yml,landing-page/src/**"
          target: "/home/${{ secrets.SSH_USER }}/ecosys"

      - name: Deploy to VPS (Production) via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.SSH_USER }}/ecosys
            
            # Escribir variables de entorno y definir variables de imagen dinámicas en la raíz
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            echo "GITHUB_REPOSITORY_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> .env
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "IMAGE_TAG=${{ github.ref_name }}" >> .env
            elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
              echo "IMAGE_TAG=production-latest" >> .env
            else
              echo "IMAGE_TAG=sandbox-latest" >> .env
            fi
            echo "DJANGO_SETTINGS_MODULE_AUTH=core.settings.production" >> .env
            echo "DJANGO_SETTINGS_MODULE_INVTZN=invtzn_core.settings.production" >> .env
            
            # Crear redes de Docker externas si no existen
            docker network inspect red_datos >/dev/null 2>&1 || docker network create red_datos
            docker network inspect red_publica >/dev/null 2>&1 || docker network create red_publica
            
            # Loguearse en GHCR
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            
            # 1. Base de datos
            cd /home/${{ secrets.SSH_USER }}/ecosys/bd
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            # 2. Backends (Auth y Negocio)
            cd /home/${{ secrets.SSH_USER }}/ecosys/auth-service
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            cd /home/${{ secrets.SSH_USER }}/ecosys/api-invtzn
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            # 3. Frontends (Vue y Estático Landing)
            cd /home/${{ secrets.SSH_USER }}/ecosys/auth-front
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            cd /home/${{ secrets.SSH_USER }}/ecosys/landing-page
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            # 4. Gateway (Proxy reverso)
            cd /home/${{ secrets.SSH_USER }}/ecosys/gateway
            docker compose --env-file ../.env -f docker-compose.prod.yml pull
            docker compose --env-file ../.env -f docker-compose.prod.yml up -d
            
            # Correr migraciones y recolectar estáticos
            cd /home/${{ secrets.SSH_USER }}/ecosys/auth-service
            docker compose --env-file ../.env -f docker-compose.prod.yml exec -T auth-service-api python manage.py migrate
            docker compose --env-file ../.env -f docker-compose.prod.yml exec -T auth-service-api python manage.py collectstatic --noinput
            
            cd /home/${{ secrets.SSH_USER }}/ecosys/api-invtzn
            docker compose --env-file ../.env -f docker-compose.prod.yml exec -T invtzn-service-api python manage.py migrate
            docker compose --env-file ../.env -f docker-compose.prod.yml exec -T invtzn-service-api python manage.py collectstatic --noinput
            
            # Limpiar imágenes obsoletas
            docker image prune -f
