services:
  db_central:
    image: postgres:15-alpine
    command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=16MB -c maintenance_work_mem=64MB -c max_connections=100
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: "${AUTH_DB_NAME}:${AUTH_DB_USER}:${AUTH_DB_PASSWORD},${API_INVTZN_DB_NAME}:${API_INVTZN_DB_USER}:${API_INVTZN_DB_PASSWORD}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - red_datos
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

volumes:
  pg_data:

networks:
  red_datos:
    external: true
